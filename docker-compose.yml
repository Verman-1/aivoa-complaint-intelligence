services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aivoa
      POSTGRES_USER: aivoa
      POSTGRES_PASSWORD: aivoa
    ports:
      - "5432:5432"
    volumes:
      - aivoa_data:/var/lib/postgresql/data
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://aivoa:aivoa@db:5432/aivoa
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      - db
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - api
volumes:
  aivoa_data:

